<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — CakeSphere</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div id="global-loader"><div class="loader-logo">CakeSphere</div><div class="loader-spinner"></div></div>
  <div id="toast-container"></div>

  <!-- LOGIN ADMIN -->
  <div class="admin-login-page">
    <div class="admin-login-card">
      <div class="admin-login-logo">
        <div class="logo-text">Cake<span>Sphere</span></div>
        <div class="admin-label">Panel de Administración</div>
      </div>

      <h2 style="text-align:center; margin-bottom:var(--space-2); font-size:var(--text-2xl);">
        Acceso exclusivo
      </h2>
      <p style="text-align:center; color:var(--color-text-muted); font-size:var(--text-sm);
                margin-bottom:var(--space-8);">
        Solo el administrador del negocio puede ingresar aquí.
      </p>

      <form id="admin-login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email administrador <span class="required">*</span></label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="admin@cakesphere.com"
            autocomplete="email"
            required
          >
          <span class="form-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña <span class="required">*</span></label>
          <div style="position:relative;">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              minlength="6"
            >
            <button type="button"
                    style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                           background:none;border:none;cursor:pointer;font-size:1rem;color:var(--color-text-light);"
                    onclick="const i=document.getElementById('password');
                             i.type=i.type==='password'?'text':'password';
                             this.textContent=i.type==='password'?'👁':'🙈';">👁</button>
          </div>
          <span class="form-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top:var(--space-2);">
          🔐 Ingresar al panel
        </button>
      </form>

      <div style="margin-top:var(--space-6);padding-top:var(--space-5);border-top:1px solid var(--color-border);
                  text-align:center;">
        <a href="../index.html" style="font-size:var(--text-sm);color:var(--color-text-muted);">
          ← Volver a la tienda
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Si ya está logueado como admin, redirigir al dashboard
    document.addEventListener('DOMContentLoaded', () => {
      getCurrentUser().then(user => {
        if (user && user.email === ADMIN_EMAIL) {
          window.location.href = 'dashboard.html';
        }
      }).catch(() => {});
    });
  </script>
</body>
</html>
