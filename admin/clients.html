<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — CakeSphere Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div id="global-loader"><div class="loader-logo">CakeSphere</div><div class="loader-spinner"></div></div>
  <div id="toast-container"></div>

  <div class="admin-app">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-sidebar-logo">
        <div class="admin-logo-text">Cake<span>Sphere</span></div>
        <div class="admin-logo-badge">Panel Admin</div>
      </div>
      <nav class="admin-nav">
        <div class="admin-nav-section">
          <div class="admin-nav-label">Principal</div>
          <a href="dashboard.html" class="admin-nav-link"><span class="nav-icon">📊</span> Dashboard</a>
          <a href="orders.html"    class="admin-nav-link"><span class="nav-icon">📦</span> Pedidos</a>
          <a href="products.html"  class="admin-nav-link"><span class="nav-icon">🎂</span> Productos</a>
          <a href="clients.html"   class="admin-nav-link active"><span class="nav-icon">👥</span> Clientes</a>
        </div>
        <div class="admin-nav-section">
          <div class="admin-nav-label">Tienda</div>
          <a href="../index.html"   class="admin-nav-link" target="_blank"><span class="nav-icon">🛒</span> Ver tienda</a>
          <a href="../catalog.html" class="admin-nav-link" target="_blank"><span class="nav-icon">📋</span> Ver catálogo</a>
        </div>
      </nav>
      <div class="admin-sidebar-footer">
        <div class="admin-user-info">
          <div class="admin-user-avatar">A</div>
          <div>
            <div class="admin-user-name">Administrador</div>
            <div class="admin-user-role">CakeSphere</div>
          </div>
        </div>
        <button class="admin-nav-link" data-logout style="width:100%;margin-top:8px;border:none;cursor:pointer;background:none;font-family:inherit;">
          <span class="nav-icon">🚪</span> Cerrar sesión
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="admin-main">
      <div class="admin-topbar">
        <div class="admin-topbar-title">Clientes Registrados</div>
        <div class="admin-topbar-right">
          <div class="admin-search">
            <span>🔍</span>
            <input type="text" id="client-search" placeholder="Buscar cliente...">
          </div>
        </div>
      </div>

      <div class="admin-content">

        <!-- Stats -->
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:var(--space-6);">
          <div class="stat-card">
            <div class="stat-card-body">
              <div class="stat-card-label">Total clientes</div>
              <div class="stat-card-value" id="stat-total-clients">—</div>
            </div>
            <div class="stat-card-icon stat-icon-clients">👥</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-body">
              <div class="stat-card-label">Nuevos este mes</div>
              <div class="stat-card-value" id="stat-new-clients">—</div>
            </div>
            <div class="stat-card-icon" style="background:#f0fdf4;color:var(--color-success);">🆕</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-body">
              <div class="stat-card-label">Con pedidos</div>
              <div class="stat-card-value" id="stat-active-clients">—</div>
            </div>
            <div class="stat-card-icon" style="background:#fdf6e9;color:var(--color-accent-gold);">🎂</div>
          </div>
        </div>

        <!-- Tabla de clientes -->
        <div class="admin-panel">
          <div class="admin-panel-header">
            <div class="admin-panel-title">Lista de clientes</div>
          </div>
          <div class="table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Cliente</th>
                  <th>Teléfono</th>
                  <th>Dirección frecuente</th>
                  <th>Registro</th>
                </tr>
              </thead>
              <tbody id="admin-clients-tbody">
                <tr>
                  <td colspan="4" style="text-align:center;padding:var(--space-8);">
                    <div class="loader-spinner" style="margin:0 auto;"></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile toggle -->
  <button class="admin-mobile-toggle" id="admin-mobile-toggle">☰</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    // Cargar stats de clientes
    async function loadClientStats() {
      try {
        const { data } = await _supabase.from('profiles').select('id, created_at');
        if (!data) return;
        const startOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString();
        document.getElementById('stat-total-clients').textContent = data.length;
        document.getElementById('stat-new-clients').textContent   = data.filter(c => c.created_at >= startOfMonth).length;

        // Clientes con pedidos
        const { count } = await _supabase
          .from('orders')
          .select('user_id', { count: 'exact', head: false });
        const uniqueClients = new Set((count || []).map(o => o?.user_id)).size;
        document.getElementById('stat-active-clients').textContent = uniqueClients || '—';
      } catch(e) {}
    }

    // Búsqueda de clientes
    let clientSearchTimeout;
    document.getElementById('client-search')?.addEventListener('input', (e) => {
      clearTimeout(clientSearchTimeout);
      clientSearchTimeout = setTimeout(() => {
        filterClients(e.target.value);
      }, 350);
    });

    async function filterClients(query) {
      const tbody = document.getElementById('admin-clients-tbody');
      if (!tbody) return;
      try {
        let q = _supabase.from('profiles').select('*').order('created_at', { ascending: false });
        if (query) {
          q = q.or(`full_name.ilike.%${query}%,email.ilike.%${query}%`);
        }
        const { data, error } = await q;
        if (error) throw error;

        if (!data?.length) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--color-text-muted);">Sin resultados.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(client => `
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:10px;">
                <div style="width:36px;height:36px;border-radius:50%;background:var(--color-accent-gold);
                            display:flex;align-items:center;justify-content:center;color:white;
                            font-weight:700;font-size:var(--text-sm);flex-shrink:0;">
                  ${(client.full_name || client.email || '?')[0].toUpperCase()}
                </div>
                <div>
                  <div style="font-weight:600;color:var(--color-primary);">${client.full_name || '—'}</div>
                  <div style="font-size:var(--text-xs);color:var(--color-text-muted);">${client.email || '—'}</div>
                </div>
              </div>
            </td>
            <td>${client.phone || '—'}</td>
            <td style="max-width:200px;font-size:var(--text-sm);color:var(--color-text-muted);">
              ${client.address || '—'}
            </td>
            <td style="font-size:var(--text-xs);color:var(--color-text-muted);">
              ${formatDate(client.created_at)}
            </td>
          </tr>
        `).join('');
      } catch(err) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:var(--color-error);text-align:center;">Error: ${err.message}</td></tr>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadClientStats();
      filterClients('');
    });
  </script>
</body>
</html>
