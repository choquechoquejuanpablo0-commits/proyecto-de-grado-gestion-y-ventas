<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — CakeSphere</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div id="global-loader"><div class="loader-logo">CakeSphere</div><div class="loader-spinner"></div></div>
  <div id="toast-container"></div>

  <div class="auth-page">

    <!-- LADO VISUAL -->
    <div class="auth-visual">
      <a href="index.html" class="auth-visual-logo">Cake<span>Sphere</span></a>
      <p class="auth-visual-text">
        Únete a la comunidad CakeSphere y disfruta de pedidos personalizados, historial guardado y más.
      </p>
      <img
        src="https://images.unsplash.com/photo-1486427944299-d1955d23e34d?w=500&h=500&fit=crop&crop=center"
        alt="Cupcakes CakeSphere"
        class="auth-visual-image"
        onerror="this.style.display='none'"
      >
    </div>

    <!-- FORMULARIO -->
    <div class="auth-form-side">
      <div class="auth-form-wrap">
        <div style="display:none;text-align:center;margin-bottom:var(--space-8);" id="mobile-logo">
          <a href="index.html" style="font-family:var(--font-heading);font-size:var(--text-3xl);
                                      font-style:italic;font-weight:700;color:var(--color-primary);">
            Cake<span style="color:var(--color-accent-gold);">Sphere</span>
          </a>
        </div>

        <h1 class="auth-form-title">Crea tu cuenta</h1>
        <p class="auth-form-sub">Es gratis y solo toma un momento.</p>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="fullname">Nombre completo <span class="required">*</span></label>
            <input
              type="text"
              id="fullname"
              class="form-input"
              placeholder="Tu nombre completo"
              autocomplete="name"
              required
            >
            <span class="form-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Correo electrónico <span class="required">*</span></label>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="tu@email.com"
              autocomplete="email"
              required
            >
            <span class="form-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Teléfono / WhatsApp</label>
            <input
              type="tel"
              id="phone"
              class="form-input"
              placeholder="+51 999 000 000"
              autocomplete="tel"
            >
            <span class="form-hint">Para enviarte actualizaciones de tu pedido.</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">
              Contraseña <span class="required">*</span>
            </label>
            <div style="position:relative;">
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="Mínimo 6 caracteres"
                autocomplete="new-password"
                required
                minlength="6"
              >
              <button type="button"
                      style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                             background:none;border:none;cursor:pointer;font-size:1rem;color:var(--color-text-light);"
                      onclick="togglePwd('password',this)">👁</button>
            </div>
            <span class="form-error" id="password-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-password">
              Confirmar contraseña <span class="required">*</span>
            </label>
            <div style="position:relative;">
              <input
                type="password"
                id="confirm-password"
                class="form-input"
                placeholder="Repite tu contraseña"
                autocomplete="new-password"
                required
                minlength="6"
              >
              <button type="button"
                      style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                             background:none;border:none;cursor:pointer;font-size:1rem;color:var(--color-text-light);"
                      onclick="togglePwd('confirm-password',this)">👁</button>
            </div>
            <span class="form-error" id="confirm-password-error"></span>
          </div>

          <!-- Indicador de fortaleza de contraseña -->
          <div id="pwd-strength" style="margin-top:-var(--space-3);margin-bottom:var(--space-4);display:none;">
            <div style="display:flex;gap:4px;margin-bottom:4px;">
              <div class="pwd-bar" style="flex:1;height:4px;border-radius:4px;background:var(--color-border);"></div>
              <div class="pwd-bar" style="flex:1;height:4px;border-radius:4px;background:var(--color-border);"></div>
              <div class="pwd-bar" style="flex:1;height:4px;border-radius:4px;background:var(--color-border);"></div>
              <div class="pwd-bar" style="flex:1;height:4px;border-radius:4px;background:var(--color-border);"></div>
            </div>
            <span id="pwd-label" style="font-size:var(--text-xs);color:var(--color-text-muted);"></span>
          </div>

          <div class="form-group">
            <label class="form-check">
              <input type="checkbox" id="accept-terms" required>
              <span class="form-check-label">
                Acepto los <a href="#" style="color:var(--color-accent-gold);">Términos y condiciones</a>
                y la <a href="#" style="color:var(--color-accent-gold);">Política de privacidad</a>.
              </span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block">
            Crear cuenta
          </button>
        </form>

        <div class="divider" style="margin: var(--space-6) 0;">
          <span style="color:var(--color-text-muted);font-size:var(--text-sm);">¿Ya tienes cuenta?</span>
        </div>

        <a href="login.html" class="btn btn-outline btn-lg btn-block">Iniciar sesión</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script>
    if (window.innerWidth <= 768) {
      document.getElementById('mobile-logo').style.display = 'block';
    }

    function togglePwd(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? '👁' : '🙈';
    }

    // Indicador de fortaleza de contraseña
    document.getElementById('password').addEventListener('input', function() {
      const val = this.value;
      const strengthEl = document.getElementById('pwd-strength');
      const bars = document.querySelectorAll('.pwd-bar');
      const label = document.getElementById('pwd-label');

      if (!val.length) { strengthEl.style.display = 'none'; return; }
      strengthEl.style.display = 'block';

      let strength = 0;
      if (val.length >= 6) strength++;
      if (val.length >= 10) strength++;
      if (/[A-Z]/.test(val) && /[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;

      const colors = ['#E57373','#F0A946','#4CAF87','#4CAF87'];
      const labels = ['Muy débil','Regular','Buena','Excelente'];
      bars.forEach((bar, i) => {
        bar.style.background = i < strength ? colors[strength-1] : 'var(--color-border)';
      });
      label.textContent = labels[strength-1] || '';
      label.style.color = colors[strength-1] || 'var(--color-text-muted)';
    });

    // Redirigir si ya está logueado
    getCurrentUser().then(user => {
      if (user) window.location.href = 'index.html';
    }).catch(() => {});
  </script>
</body>
</html>
